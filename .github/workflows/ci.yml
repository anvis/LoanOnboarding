name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LoanOnboarding.slnx

      - name: Build
        run: dotnet build LoanOnboarding.slnx --configuration Release --no-restore

      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
